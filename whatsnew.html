<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Dashboard – What’s new</title><meta name="theme-color" content="#0c0e12">
<link rel="icon" href="admin/icons/icon-192.png">
<link rel="stylesheet" href="shared/base.css">
<style>
 .wrap { max-width: 820px; margin: 0 auto; padding: 26px 18px 60px; }
 .top { display: flex; align-items: center; gap: 14px; } .top h1 { margin: 0; font-size: 26px; } .top a { margin-left: auto; color: var(--acc); text-decoration: none; font-size: 14px; }
 .rel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px; margin-top: 14px; }
 .rel h2 { margin: 0; font-size: 17px; display: flex; gap: 10px; align-items: baseline; } .rel h2 span { color: var(--mute); font-weight: 400; font-size: 14px; }
 .rel ul { margin: 8px 0 0; padding-left: 20px; } .rel li { color: #cdd5e1; margin: 5px 0; font-size: 15px; }
 .rel.latest { border-color: var(--acc); }
</style>
</head>
<body><div class="wrap">
 <div class="top"><h1>What’s new</h1><a href="./">‹ Family Dashboard home</a></div>
 <p class="sub" style="color:var(--mute)">Everything updates itself – these are the changes as they arrived.</p>
 <div id="list">Loading…</div>
</div>
<script>
 fetch('history.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (H) {
   var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
   var nice = function (d) { var x = /^(\d{4})-(\d\d)-(\d\d)$/.exec(d); return x ? new Date(+x[1], +x[2] - 1, +x[3]).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : ''; };
   document.getElementById('list').innerHTML = H.map(function (r, i) {
     return '<div class="rel' + (i ? '' : ' latest') + '"><h2>' + (/^\d/.test(r.version) ? 'Version ' : '') + esc(r.version) + '<span>' + esc(nice(r.date)) + '</span></h2><ul>' +
       r.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></div>';
   }).join('');
 }).catch(function () { document.getElementById('list').textContent = 'Couldn’t load the history.'; });
</script>
</body></html>
