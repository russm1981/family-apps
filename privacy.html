<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy notice – Family Dashboard</title><meta name="theme-color" content="#0c0e12">
<link rel="stylesheet" href="shared/base.css">
<style>.wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 50px; line-height: 1.55; } h1 { font-size: 28px; } h3 { margin: 22px 0 6px; } li { margin: 6px 0; } .mute { color: var(--mute); }</style>
</head>
<body><div class="wrap"><h1>Privacy notice</h1><p class="mute" id="ver"></p><h3>In short</h3><ul id="sum"></ul><div id="full"></div>
<p><a href="./">← Family Dashboard</a></p></div>
<script src="shared/privacy.js"></script>
<script>
 var P = window.FD_PRIVACY;
 document.getElementById('ver').textContent = 'Version ' + P.version + ', updated ' + P.updated;
 document.getElementById('sum').innerHTML = P.summary.map(function (x) { return '<li>' + x + '</li>'; }).join('');
 document.getElementById('full').innerHTML = P.full;
</script>
</body></html>
