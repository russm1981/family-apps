<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Family Dashboard Configurator</title>
    <meta name="theme-color" content="#0c0e12">
    <link rel="icon" href="../admin/icons/icon-192.png">
    <script>
    // One address for everything set-up. Links into a particular step of the step-by-step guide (from the licence
    // email, the Sheet's menu, Family Admin, the pairing page) go to the guide.
    (function () {
        var h = location.hash || '', q = location.search || '';
        if (/[?&]connect\b/.test(q)) return;                                   // "connect this computer" by code
        if (/(^|[#&])(key|from|go|update|pair|pack)(=|&|$)/.test(h)) { location.replace('guide/' + h); return; }
        // Everything else stays here: the Setup website (with its First-time setup tab, or a choice if this computer isn't connected yet).
    })();
    </script>
    <link rel="stylesheet" href="../shared/base.css?v=202611112">
    <link rel="stylesheet" href="../admin/admin.css?v=202611112">
    <link rel="stylesheet" href="desk.css?v=202611112">
    <link rel="stylesheet" href="editor.css?v=202611112">
</head>
<body class="desk">
    <!-- The Setup website: the same app as Family Admin, plus the screen layout, the rarely-used settings and the guide. -->
    <div id="app"></div>
    <script>window.FD_DESK = true;</script>
    <script src="../shared/fd.js?v=202611112"></script>
    <script src="../shared/pair.js?v=202611112"></script>
    <script src="../shared/qrcode.js?v=202611112"></script>
    <script src="../shared/privacy.js?v=202611112"></script>
    <script src="editor.js?v=202611112"></script>
    <script src="calsetup.js?v=202611112"></script>
    <script src="../admin/app.js?v=202611112"></script>
</body>
</html>
