<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Dashboard licences</title>
<style>
:root { --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a; --text: #e8ecf2; --mute: #8b93a3; --acc: #3fa9f5; --good: #34c759; --bad: #ff5b5b; --warn: #ffb020; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0 auto 0 0; }
nav { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
nav button { background: none; border: 0; padding: 8px 12px; border-radius: 9px; color: var(--mute); font-weight: 600; cursor: pointer; }
nav button.on { background: var(--panel2); color: var(--text); }
nav .ngrp { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); margin: 0 2px 0 6px; }
nav .nsep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }
nav button[data-t=settings] { font-size: 18px; padding: 6px 10px; }
.ph { font-size: 20px; margin: 0 0 14px; }
main { max-width: 1150px; margin: 0 auto; padding: 20px 16px 60px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
.card h2 { margin: 0 0 10px; font-size: 17px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.stat b { display: block; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--mute); font-size: 13px; }
.mute { color: var(--mute); } .small { font-size: 13px; }
label { display: block; font-size: 13px; color: var(--mute); margin: 12px 0 4px; }
input, select, textarea { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--acc); }
textarea { min-height: 120px; resize: vertical; }
.btn { background: var(--acc); color: #fff; border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 700; cursor: pointer; }
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--text); }
.btn.bad { background: none; border: 1px solid rgba(255,91,91,.6); color: var(--bad); }
.btn.good { background: var(--good); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 14px; }
@media (max-width: 720px) { .grid2, .grid4 { grid-template-columns: 1fr; } header { padding: 12px; } main { padding: 14px 10px 60px; } }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--mute); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--panel2); }
.scroll { overflow: auto; max-height: 62vh; }
.key { font-family: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; letter-spacing: .02em; white-space: nowrap; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; border: 1px solid; white-space: nowrap; }
.pill.Active { color: var(--good); border-color: rgba(52,199,89,.5); }
.pill.Issued { color: var(--acc); border-color: rgba(63,169,245,.5); }
.pill.Revoked { color: var(--bad); border-color: rgba(255,91,91,.5); }
.pill.New { color: var(--warn); border-color: rgba(255,176,32,.5); }
.pill.st-In { color: var(--acc); border-color: rgba(63,169,245,.5); }
.pill.Waiting { color: var(--mute); border-color: var(--line); }
.pill.Resolved, .pill.Closed { color: var(--good); border-color: rgba(52,199,89,.5); }
.fb-msg { white-space: pre-wrap; background: var(--panel2); border-radius: 10px; padding: 12px; margin: 8px 0; }
.err { color: var(--bad); } .ok { color: var(--good); }
.status { margin-top: 12px; font-size: 14px; }
.keys { font-family: "Roboto Mono", ui-monospace, monospace; background: var(--panel2); border-radius: 10px; padding: 12px; white-space: pre-wrap; user-select: all; }
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 20; }
.drawer-bg.on { display: block; }
.drawer { position: absolute; right: 0; top: 0; bottom: 0; width: min(480px, 100%); background: var(--panel); border-left: 1px solid var(--line); padding: 20px; overflow: auto; }
.drawer h2 { margin: 0 0 6px; font-size: 18px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 14px; margin: 10px 0; }
.kv span:nth-child(odd) { color: var(--mute); }
.log { font-size: 13px; border-top: 1px solid var(--line); padding: 7px 0; }
.log b { font-weight: 600; }
.login { max-width: 380px; margin: 12vh auto; }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 22px; text-align: center; color: var(--mute); }
.drop.over { border-color: var(--acc); color: var(--text); }
.tag { font-size: 12px; color: var(--mute); }
.dup { color: var(--warn); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #222836; border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; display: none; z-index: 30; }
.toast.on { display: block; } .toast.bad { border-color: var(--bad); }
</style>
</head>
<body>
<div id="app"></div>
<div class="drawer-bg" id="drawerBg"><div class="drawer" id="drawer"></div></div>
<div class="toast" id="toast"></div>
<script>
var IN_SHEET = <?= !!inSheet ?>;
var PW = '', TAB = 'overview', ROWS = null, FILTER = { q: '', status: '' }, CSV = null;
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(t, bad) { var el = $('toast'); el.textContent = t; el.className = 'toast on' + (bad ? ' bad' : ''); clearTimeout(toast.t); toast.t = setTimeout(function () { el.className = 'toast'; }, 3500); }
function call(op, args) {
  return new Promise(function (res, rej) {
    google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(new Error(e && e.message || String(e))); }).admin(PW, op, args || {});
  });
}
function copy(text) {
  try { navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, fallback); } catch (e) { fallback(); }
  function fallback() { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); toast('Copied'); }
}
function day(s) { return s ? String(s).slice(0, 10) : ''; }
function ago(s) {
  if (!s) return ''; var d = (Date.now() - Date.parse(s)) / 864e5;
  return d < 1 ? 'today' : d < 2 ? 'yesterday' : Math.floor(d) + ' days ago';
}

/* ---------------------------------------------------------------- sign in */
function start() {
  if (!IN_SHEET) { try { PW = sessionStorage.getItem('lsPw') || ''; } catch (e) { PW = ''; } }
  call('hello').then(frame, function (e) { if (IN_SHEET) { $('app').innerHTML = '<div class="card login"><p class="err">' + esc(e.message) + '</p></div>'; } else login(PW ? e.message : ''); });
}
function login(msg) {
  $('app').innerHTML = '<div class="card login"><h2>🔑 Licence admin</h2><p class="mute small">Enter the admin password (from setup, or 🔑 Licences › Make a new admin password in the Sheet).</p>' +
    '<label>Admin password</label><input id="pw" type="password" autocomplete="current-password">' +
    '<div class="row" style="margin-top:14px"><button class="btn" id="go">Sign in</button></div><p class="err small" id="lerr">' + esc(msg || '') + '</p></div>';
  $('pw').focus();
  var go = function () {
    PW = $('pw').value.trim(); $('lerr').textContent = '';
    call('hello').then(function () { try { sessionStorage.setItem('lsPw', PW); } catch (e) { } frame(); }, function (e) { $('lerr').textContent = e.message; });
  };
  $('go').onclick = go; $('pw').onkeydown = function (e) { if (e.key === 'Enter') go(); };
}

/* ---------------------------------------------------------------- frame */
function frame() {
  // Two groups – the licences, and support (feedback and requests, opening diagnostics reports) – with settings as a cog.
  var b = function (t) { return '<button data-t="' + t[0] + '"' + (t[2] ? ' title="' + t[2] + '"' : '') + '>' + t[1] + '</button>'; };
  $('app').innerHTML = '<header><h1>🔑 Family Dashboard licences</h1><nav id="nav">' +
    '<span class="ngrp">Licences</span>' + [['overview', 'Overview'], ['licences', 'Licences'], ['issue', 'Issue keys'], ['import', 'Import CSV']].map(b).join('') +
    '<span class="nsep"></span><span class="ngrp">Support</span>' + [['feedback', 'Feedback & requests'], ['support', 'Diagnostics']].map(b).join('') +
    '<span class="nsep"></span>' + b(['settings', '⚙', 'Settings']) +
    (IN_SHEET ? '' : '<button id="out">Sign out</button>') + '</nav></header><main id="main"></main>';
  $('nav').onclick = function (e) { var b = e.target.closest('[data-t]'); if (b) { TAB = b.getAttribute('data-t'); render(); } };
  if ($('out')) $('out').onclick = function () { try { sessionStorage.removeItem('lsPw'); } catch (e) { } PW = ''; login(''); };
  $('drawerBg').onclick = function (e) { if (e.target === $('drawerBg')) closeDrawer(); };
  render();
}
function render() {
  Array.prototype.forEach.call(document.querySelectorAll('#nav [data-t]'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === TAB); });
  ({ overview: overview, licences: licences, issue: issuePage, import: importPage, settings: settingsPage, support: supportPage, feedback: feedbackPage })[TAB]();
}
function loadRows() { return call('list').then(function (d) { ROWS = d.rows; return ROWS; }); }

/* ---------------------------------------------------------------- overview */
function overview() {
  $('main').innerHTML = '<p class="mute">Loading…</p>';
  call('summary').then(function (d) {
    var c = d.counts;
    var vs = Object.keys(d.versions).sort().reverse().map(function (v) { return esc(v) + ': ' + d.versions[v]; }).join(' · ');
    $('main').innerHTML = '<div class="stats">' +
      stat(c.active, 'in use') + stat(c.issued, 'issued, not used yet') + stat(c.revoked, 'revoked') + stat(c.seenWeek, 'checked in this week') +
      stat(c.unsent, 'not emailed yet') + stat(c.total, 'keys altogether') + stat(d.feedbackOpen || 0, 'feedback and support requests outstanding') + '</div>' +
      (c.unsent ? '<div class="card"><div class="row"><span style="flex:1"><b>' + c.unsent + ' key' + (c.unsent > 1 ? 's have' : ' has') + ' an email address but hasn’t been sent.</b></span><button class="btn" id="sendUnsent">Email them now</button></div></div>' : '') +
      (c.quiet ? '<div class="card"><b>' + c.quiet + '</b> <span class="mute">dashboard' + (c.quiet > 1 ? 's haven’t' : ' hasn’t') + ' checked in for a month (switched off, or moved).</span></div>' : '') +
      '<div class="card"><h2>Recent activity</h2>' + (d.recent.length ? d.recent.map(logLine).join('') : '<p class="mute">Nothing yet.</p>') + '</div>' +
      '<div class="card small"><span class="mute">Dashboard versions in use: ' + (vs || '–') + '.</span><br>Licence server <b>' + esc(d.version) + '</b> · automatic updates <b>' + (d.autoUpdate ? 'on' : 'off – run Set up from the 🔑 Licences menu') + '</b>' +
        (d.lastUpdate && d.lastUpdate.at ? '<br><span class="' + (d.lastUpdate.result === 'failed' ? 'err' : 'mute') + '">Last update ' + esc(String(d.lastUpdate.at).slice(0, 16).replace('T', ' ')) + ': ' + esc(d.lastUpdate.result) +
          (d.lastUpdate.to ? ' (' + esc(d.lastUpdate.to) + ')' : '') + (d.lastUpdate.message ? ' – ' + esc(d.lastUpdate.message).replace(/https:\/\/[^\s,)]+/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'; }) : '') + '</span>' : '') +
        (d.loader ? '<br><span class="mute">Loads its program from GitHub (loader ' + esc(d.loader.loader) + ') – updates arrive by themselves within 5 minutes.</span>' +
          (d.loader.newerLoader ? '<br><span class="err">A newer loader is available: paste Scripts/Licence/Loader.gs into “Code” again.</span>' : '') : '') +
        (d.saved ? '<br><span class="' + (d.saved.warn ? 'err' : 'mute') + '">Saved versions: <b>' + d.saved.used + ' of ' + d.saved.max + '</b>' +
          (d.saved.warn ? ' – nearly full. In the licence Apps Script open Project history and delete old versions (the web address stays the same).' : '') + '</span>' : '') +
        ' <button class="btn ghost" id="lsUpd" style="margin-left:8px;padding:4px 10px">Check for an update</button></div>';
    $('lsUpd').onclick = function () {
      this.disabled = true; this.textContent = 'Checking…';
      call('selfUpdate').then(function (r) { toast(r.updated ? 'Updated to ' + r.to + ' – reload this page' : r.upToDate ? 'Up to date' : (r.message || 'Done'), !!r.approval); overview(); },
        function (e) { toast(e.message, true); overview(); });
    };
    if ($('sendUnsent')) $('sendUnsent').onclick = function () {
      this.disabled = true; call('emailUnsent').then(function (r) { toast(r.sent + ' sent'); overview(); }, function (e) { toast(e.message, true); overview(); });
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-key]'), function (a) { a.onclick = function () { openKey(a.getAttribute('data-key')); }; });
  }, function (e) { $('main').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
}
function stat(n, label) { return '<div class="stat"><b>' + n + '</b><span>' + label + '</span></div>'; }
function logLine(l) {
  return '<div class="log"><span class="mute">' + esc(l.when) + '</span> · <b>' + esc(l.event) + '</b> ' +
    (l.key ? '<a href="#" class="key" data-key="' + esc(l.key) + '" style="color:var(--acc)">' + esc(l.key) + '</a>' : '') + (l.detail ? ' <span class="mute">' + esc(l.detail) + '</span>' : '') + '</div>';
}

/* ---------------------------------------------------------------- licences */
function licences() {
  $('main').innerHTML = '<div class="card"><div class="row"><input id="q" placeholder="Search key, name, email, order…" value="' + esc(FILTER.q) + '" style="flex:1;min-width:200px">' +
    '<select id="st" style="width:auto">' + [['', 'Every status'], ['Active', 'In use'], ['Issued', 'Not used yet'], ['Revoked', 'Revoked']].map(function (o) {
      return '<option value="' + o[0] + '"' + (o[0] === FILTER.status ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
    '<button class="btn ghost" id="csv">Download CSV</button></div>' +
    '<div class="scroll" style="margin-top:12px"><table><thead><tr><th>Key</th><th>Status</th><th>Name</th><th>Email</th><th>Order</th><th>Screens</th><th>Last check</th><th>Version</th></tr></thead><tbody id="tb"><tr><td colspan="8" class="mute">Loading…</td></tr></tbody></table></div>' +
    '<p class="mute small" id="cnt"></p></div>';
  $('q').oninput = function () { FILTER.q = this.value; table(); };
  $('st').onchange = function () { FILTER.status = this.value; table(); };
  $('csv').onclick = function () { download('licences.csv', toCsv(filtered(), ['Key', 'Status', 'Name', 'Email', 'Order', 'Screens', 'Source', 'Issued', 'Emailed', 'Activated', 'Install', 'Last check', 'Version', 'Checks', 'Notes'])); };
  $('tb').onclick = function (e) { var tr = e.target.closest('[data-k]'); if (tr) openKey(tr.getAttribute('data-k')); };
  loadRows().then(table, function (e) { $('tb').innerHTML = '<tr><td colspan="8" class="err">' + esc(e.message) + '</td></tr>'; });
}
function filtered() {
  var q = FILTER.q.trim().toLowerCase();
  return (ROWS || []).filter(function (r) {
    if (FILTER.status && r.Status !== FILTER.status) return false;
    return !q || [r.Key, r.Name, r.Email, r.Order, r.Notes, r.Source].join(' ').toLowerCase().indexOf(q) >= 0;
  }).slice().reverse();
}
function table() {
  var list = filtered();
  $('tb').innerHTML = list.length ? list.slice(0, 500).map(function (r) {
    return '<tr data-k="' + esc(r.Key) + '"><td class="key">' + esc(r.Key) + '</td><td><span class="pill ' + esc(r.Status) + '">' + esc(r.Status === 'Active' ? 'In use' : r.Status === 'Issued' ? 'Not used yet' : r.Status) + '</span></td>' +
      '<td>' + esc(r.Name) + '</td><td>' + esc(r.Email) + (r.Email && !r.Emailed && r.Status !== 'Revoked' ? ' <span class="tag dup">not sent</span>' : '') + '</td><td>' + esc(r.Order) + '</td><td>' + esc(r.Screens || 1) + '</td>' +
      '<td>' + esc(ago(r['Last check'])) + '</td><td>' + esc(r.Version) + '</td></tr>';
  }).join('') : '<tr><td colspan="8" class="mute">No licences match.</td></tr>';
  $('cnt').textContent = list.length + ' of ' + (ROWS || []).length + ' licences' + (list.length > 500 ? ' (first 500 shown – search to narrow down)' : '');
}
function openDrawer(html) { $('drawer').innerHTML = html; $('drawerBg').classList.add('on'); }
function closeDrawer() { $('drawerBg').classList.remove('on'); }
function openKey(key) {
  var r = (ROWS || []).filter(function (x) { return x.Key === key; })[0];
  if (!r) { loadRows().then(function () { if ((ROWS || []).some(function (x) { return x.Key === key; })) openKey(key); else toast('Not found', true); }); return; }
  openDrawer('<div class="row"><h2 style="flex:1">Licence</h2><button class="btn ghost" id="dx">Close</button></div>' +
    '<div class="row"><span class="key" style="font-size:16px">' + esc(r.Key) + '</span><button class="btn ghost" id="dCopy">Copy</button></div>' +
    '<div class="kv"><span>Status</span><span><span class="pill ' + esc(r.Status) + '">' + esc(r.Status) + '</span></span>' +
    '<span>Issued</span><span>' + esc(day(r.Issued)) + ' · ' + esc(r.Source) + '</span>' +
    '<span>Emailed</span><span>' + esc(day(r.Emailed) || '–') + '</span>' +
    '<span>Activated</span><span>' + esc(day(r.Activated) || '–') + '</span>' +
    '<span>Last check</span><span>' + esc(r['Last check'] ? day(r['Last check']) + ' (' + ago(r['Last check']) + ')' : '–') + '</span>' +
    '<span>Version</span><span>' + esc(r.Version || '–') + '</span>' +
    '<span>Dashboard</span><span class="small">' + esc(r.Install || 'not in use') + '</span></div>' +
    '<label>Name</label><input id="dName" value="' + esc(r.Name) + '"><label>Email</label><input id="dEmail" value="' + esc(r.Email) + '">' +
    '<label>Order</label><input id="dOrder" value="' + esc(r.Order) + '"><label>Screens allowed (Corsair, tablet, computer… – phones don’t count)</label><input id="dScreens" type="number" min="1" max="20" value="' + esc(r.Screens || 1) + '"><label>Notes</label><input id="dNotes" value="' + esc(r.Notes) + '">' +
    '<div class="row" style="margin-top:12px"><button class="btn" id="dSave">Save</button>' + (r.Email && r.Status !== 'Revoked' ? '<button class="btn ghost" id="dMail">' + (r.Emailed ? 'Email the key again' : 'Email the key') + '</button>' : '') + '</div>' +
    '<h3 style="margin-top:22px">Actions</h3><div class="row">' +
    (r.Install ? '<button class="btn ghost" id="dRel" title="Let it be used on a different dashboard">Release (moving dashboard)</button>' : '') +
    (r.Status === 'Revoked' ? '<button class="btn good" id="dRein">Reinstate</button>' : '<button class="btn bad" id="dRev">Revoke</button>') +
    (r.Install ? '' : '<button class="btn bad" id="dDel">Delete</button>') + '</div>' +
    '<p class="mute small">Release: the key can be activated on another dashboard; the old one locks at its next daily check. Revoke: the dashboard locks at its next daily check.</p>' +
    '<h3 style="margin-top:22px">History</h3><div id="dLog" class="mute small">Loading…</div>');
  var after = function (msg) { return function () { toast(msg); loadRows().then(function () { if (TAB === 'licences') table(); openKey(key); }); }; };
  var fail = function (e) { toast(e.message, true); };
  $('dx').onclick = closeDrawer;
  $('dCopy').onclick = function () { copy(r.Key); };
  $('dSave').onclick = function () { call('update', { key: key, fields: { name: $('dName').value, email: $('dEmail').value, order: $('dOrder').value, notes: $('dNotes').value, screens: $('dScreens').value } }).then(after('Saved'), fail); };
  if ($('dMail')) $('dMail').onclick = function () { this.disabled = true; call('email', { key: key }).then(after('Email sent'), fail); };
  if ($('dRel')) $('dRel').onclick = function () { if (confirm('Release this key so it can be used on another dashboard?')) call('release', { key: key }).then(after('Released'), fail); };
  if ($('dRev')) $('dRev').onclick = function () { var why = prompt('Revoke this key? Its dashboard locks at its next daily check.\n\nReason (optional, e.g. refund):', ''); if (why !== null) call('revoke', { key: key, reason: why }).then(after('Revoked'), fail); };
  if ($('dRein')) $('dRein').onclick = function () { call('reinstate', { key: key }).then(after('Reinstated'), fail); };
  if ($('dDel')) $('dDel').onclick = function () { if (confirm('Delete this key completely?')) call('delete', { key: key }).then(function () { toast('Deleted'); closeDrawer(); loadRows().then(function () { if (TAB === 'licences') table(); }); }, fail); };
  call('log', { key: key }).then(function (d) { $('dLog').innerHTML = d.rows.length ? d.rows.map(logLine).join('') : 'Nothing yet.'; }, function (e) { $('dLog').textContent = e.message; });
}

/* ---------------------------------------------------------------- issue by hand */
function issuePage() {
  $('main').innerHTML = '<div class="card"><h2>Issue keys by hand</h2><p class="mute small">For a sale outside the shop, a gift, or spare keys. Leave the name and email blank for unassigned keys.</p>' +
    '<div class="grid2"><div><label>Name</label><input id="iName"></div><div><label>Email</label><input id="iEmail" type="email"></div>' +
    '<div><label>Order / reference</label><input id="iOrder"></div><div><label>How many keys</label><input id="iCount" type="number" min="1" max="500" value="1"></div>' +

function parseCsv(text) {

  var first = text.split(/\r?\n/)[0] || '', sep = (first.split(';').length > first.split(',').length) ? ';' : (first.split('\t').length > first.split(',').length ? '\t' : ',');

    else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }

}

      crypto.subtle.generateKey({ name: 'RSA-OAEP', modulusLength: 3072, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' }, true, ['encrypt', 'decrypt'])
        .then(function (kp) { return Promise.all([crypto.subtle.exportKey('jwk', kp.publicKey), crypto.subtle.exportKey('jwk', kp.privateKey)]); })
        .then(function (k) { return call('saveSupportKey', { publicKey: k[0], privateKey: k[1] }); })
        .then(function () { toast('Support key made'); wireSupportKey(); }, function (e) { toast(e.message, true); wireSupportKey(); });
    };
  }, function (e) { $('skBody').textContent = e.message; });
}

/* ---------------------------------------------------------------- settings */
function settingsPage() {
  $('main').innerHTML = '<p class="mute">Loading…</p>';
  call('settings').then(function (d) {
    var s = d.settings;
    $('main').innerHTML = '<h2 class="ph">⚙ Settings</h2><div class="card"><h2>Email to buyers</h2><p class="mute small">{name} = first name, {key} = their key(s), {setup} = the setup link (on a line of its own it becomes a big “Start setting up” button), {help} = the setup help page, {seller} = your name. Google lets you send ' + d.quota + ' more today.</p>' +
      '<div class="grid2"><div><label>From (name)</label><input id="sSeller" value="' + esc(s.sellerName) + '"></div><div><label>Setup link</label><input id="sSetup" value="' + esc(s.setupLink) + '"></div></div>' +
      '<label>Subject</label><input id="sSubj" value="' + esc(s.subject) + '"><label>Message</label><textarea id="sBody" style="min-height:240px">' + esc(s.body) + '</textarea>' +
      '<div class="row" style="margin-top:12px"><button class="btn" id="sSave">Save</button><button class="btn ghost" id="sTest">Send me a sample</button><button class="btn ghost" id="sReset">Back to the standard wording</button></div><div id="sOut" class="status"></div></div>' +
      supportKeyCard() +
      '<div class="card"><h2>Admin password</h2><div class="grid2"><div><label>New password (12+ characters)</label><input id="p1" type="password" autocomplete="new-password"></div>' +
      '<div><label>Again</label><input id="p2" type="password" autocomplete="new-password"></div></div><div class="row" style="margin-top:12px"><button class="btn ghost" id="pSave">Change password</button></div><div id="pOut" class="status"></div></div>';
    if ($('cpUrl')) $('cpUrl').onclick = function () { copy(d.url); };
    wireSupportKey();
    $('sSave').onclick = function () {
      call('saveSettings', { sellerName: $('sSeller').value, setupLink: $('sSetup').value, subject: $('sSubj').value, body: $('sBody').value })
        .then(function () { $('sOut').innerHTML = '<span class="ok">✔ Saved</span>'; }, function (e) { $('sOut').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
    };
    $('sTest').onclick = function () {
      $('sOut').textContent = 'Sending…';
      call('testEmail').then(function (r) { $('sOut').innerHTML = '<span class="ok">✔ Sent to ' + esc(r.to) + '</span>'; }, function (e) { $('sOut').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
    };
    $('sReset').onclick = function () {
      if (!confirm('Put the standard subject, message and setup link back?')) return;
      call('saveSettings', { setupLink: '', subject: '', body: '' }).then(function () { settingsPage(); }, function (e) { $('sOut').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
    };
    $('pSave').onclick = function () {
      if ($('p1').value !== $('p2').value) { $('pOut').innerHTML = '<span class="err">The two passwords are different</span>'; return; }
      call('password', { password: $('p1').value }).then(function () {
        PW = $('p1').value; try { if (!IN_SHEET) sessionStorage.setItem('lsPw', PW); } catch (e) { }
        $('pOut').innerHTML = '<span class="ok">✔ Changed</span>'; $('p1').value = $('p2').value = '';
      }, function (e) { $('pOut').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
    };
  }, function (e) { $('main').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
}
start();
</script>
