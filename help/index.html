<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Dashboard – Help</title><meta name="theme-color" content="#0c0e12">
<link rel="icon" href="../admin/icons/icon-192.png">
<link rel="stylesheet" href="../shared/base.css">
<style>
 body { min-height: 100vh; }
 .wrap { max-width: 1500px; margin: 0 auto; padding: 24px clamp(16px, 2.5vw, 40px) 60px; display: grid; grid-template-columns: minmax(300px, 340px) minmax(0, 1fr); gap: 32px; }
 @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } nav.side { position: static !important; } }
 .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
 .top a.home { color: var(--acc); text-decoration: none; font-size: 14px; margin-left: auto; }
 .top .logo { width: 44px; height: 44px; border-radius: 13px; background: var(--acc); display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; }
 .top h1 { font-size: 26px; margin: 0; }
 nav.side { position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 4px; max-height: calc(100vh - 32px); overflow: auto; }
 nav.side input { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; margin-bottom: 8px; }
 nav.side a { display: flex; gap: 10px; align-items: center; color: #cdd5e1; text-decoration: none; padding: 8px 10px; border-radius: 10px; font-size: 15px; }
 nav.side a:hover { background: var(--panel); } nav.side a.on { background: var(--panel-2); color: #fff; font-weight: 700; }
 nav.side a i { font-style: normal; width: 24px; text-align: center; flex: none; }
 nav.side a.cat { font-weight: 700; font-size: 16px; white-space: nowrap; color: #e8ecf2; }
 nav.side a.cat .chev { margin-left: auto; color: var(--mute); font-size: 12px; transition: transform .15s; }
 nav.side a.cat.open .chev { transform: rotate(90deg); }
 nav.side .sub { display: flex; flex-direction: column; gap: 2px; margin: 0 0 6px 22px; padding-left: 10px; border-left: 1px solid var(--line); }
 nav.side .sub a { font-size: 14.5px; padding: 6px 10px; }
 nav.side a.sup { margin-top: 6px; border: 1px solid rgba(63,169,245,.4); color: #9fd2ff; }
 article { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 30px 30px; min-width: 0; }
 article h1 { margin: 0 0 6px; font-size: 28px; display: flex; gap: 12px; align-items: center; }
 article .lead { color: #cdd5e1; font-size: 17px; margin: 0 0 16px; }
 article h2 { font-size: 19px; margin: 22px 0 6px; }
 article p, article li, article dd, article td { color: #cdd5e1; font-size: 16px; line-height: 1.6; }
 article dt { font-weight: 700; margin-top: 12px; } article dd { margin: 4px 0 0 0; }
 article a { color: var(--acc); }
 article code { background: #0b0d11; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
 table.t { border-collapse: collapse; width: 100%; } table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; } table.t td:first-child { white-space: nowrap; }
 .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; } .dot.g { background: #34c759; } .dot.o { background: #ffb020; } .dot.r { background: #ff5b5b; }
 .still { margin-top: 26px; padding: 14px 16px; border-radius: 14px; background: rgba(63,169,245,.1); border: 1px solid rgba(63,169,245,.35); color: #cdd5e1; font-size: 15px; }
 .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-top: 10px; }
 .cats a { display: grid; grid-template-columns: 44px 1fr; gap: 4px 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 18px; text-decoration: none; color: inherit; }
 .cats a:hover { border-color: var(--acc); }
 .cats a span.ic { grid-row: 1 / 4; font-size: 30px; line-height: 1; }
 .cats a b { font-size: 17px; } .cats a small { color: var(--mute); font-size: 14px; line-height: 1.4; } .cats a em { font-style: normal; color: var(--acc); font-size: 13px; }
 .cats a.sup { background: rgba(63,169,245,.1); border-color: rgba(63,169,245,.4); }
 .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
 .list a { display: block; background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-decoration: none; color: inherit; }
 .list a:hover { border-color: var(--acc); }
 .list a b { display: block; margin-bottom: 4px; } .list a span { color: var(--mute); font-size: 14px; }
</style>
</head>
<body><div class="wrap">
 <div class="top"><span class="logo">?</span><h1>Help</h1><a class="home" href="../">‹ Family Dashboard home</a></div>
 <nav class="side" id="side"></nav>
 <article id="art"></article>
</div>
<script src="topics.js"></script>
<script>
 (function () {
   'use strict';
   var T = window.FD_HELP || [], $ = function (id) { return document.getElementById(id); };
   if (window.top !== window) document.querySelector('.top').style.display = 'none';      // inside the Configurator or the app: they have the title
   // Five kinds of question, and a support request. Each topic is in one of them.
   var CATS = [
     { id: 'start', icon: '🚀', name: 'Getting started', what: 'First-time setup, your licence, and connecting the screen, phones and tablets', topics: ['where', 'setup', 'licence', 'connect', 'screens', 'pi', 'startup'] },
     { id: 'widgets', icon: '▦', name: 'Screens and widgets', what: 'Adding and setting up widgets, live-data keys, bin days, sleep and voice', topics: ['widget', 'keys', 'bins', 'sleep', 'voice'] },
     { id: 'family', icon: '⭐', name: 'Calendar and rewards', what: 'Calendar colours and categories, points, tasks, to-dos and reminders', topics: ['calendar', 'points'] },
     { id: 'trouble', icon: '🔧', name: 'Troubleshooting', what: 'The coloured dot, “can’t reach the Sheet”, widget problems and updates', topics: ['dot', 'sheet', 'updates', 'report'] },
     { id: 'data', icon: '🔐', name: 'Your data and account', what: 'Privacy, moving to another Google account, and starting again', topics: ['privacy', 'account', 'afresh'] },
   ];
   var SUPPORT = '../setup/#/feedback/support';
   T.forEach(function (t) { if (!CATS.some(function (c) { return c.topics.indexOf(t.id) >= 0; })) CATS[1].topics.push(t.id); });   // a new topic not sorted yet
   function topic(id) { return T.filter(function (x) { return x.id === id; })[0]; }
   function catOf(id) { return CATS.filter(function (c) { return c.id === id || c.topics.indexOf(id) >= 0; })[0]; }
   function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
   function nav(q) {
     q = (q || '').toLowerCase();
     var cur = location.hash.slice(1), open = catOf(cur);
     var match = function (t) { return t && (!q || (t.title + ' ' + t.summary + ' ' + t.body).toLowerCase().indexOf(q) >= 0); };
     $('side').innerHTML = '<input id="q" placeholder="Search help…" value="' + esc(q) + '">' + '<a href="#"' + (!cur ? ' class="on"' : '') + '><i>⌂</i>Help home</a>' +
       CATS.map(function (c) {
         var ts = c.topics.map(topic).filter(match), show = q ? ts.length : c === open;
         if (q && !ts.length) return '';
         return '<a class="cat' + (show ? ' open' : '') + (cur === c.id ? ' on' : '') + '" href="#' + c.id + '"><i>' + c.icon + '</i>' + esc(c.name) + '<span class="chev">▶</span></a>' +
           (show ? '<div class="sub">' + ts.map(function (t) { return '<a href="#' + t.id + '"' + (t.id === cur ? ' class="on"' : '') + '>' + esc(t.title) + '</a>'; }).join('') + '</div>' : '');
       }).join('') +
       '<a class="sup" href="' + SUPPORT + '" target="_top"><i>💬</i>Ask for help – a support request</a>';
     var box = $('q'); box.oninput = function () { var v = box.value, p = box.selectionStart; nav(v); $('q').focus(); $('q').setSelectionRange(p, p); };
   }
   function cards(ts) { return '<div class="list">' + ts.map(function (x) { return '<a href="#' + x.id + '"><b>' + x.icon + ' ' + esc(x.title) + '</b><span>' + esc(x.summary) + '</span></a>'; }).join('') + '</div>'; }
   function show() {
     var id = location.hash.slice(1), t = topic(id), c = CATS.filter(function (x) { return x.id === id; })[0];
     if (c) {
       $('art').innerHTML = '<h1><span>' + c.icon + '</span>' + esc(c.name) + '</h1><p class="lead">' + esc(c.what) + '.</p>' + cards(c.topics.map(topic).filter(Boolean)) +
         '<div class="still"><b>Can’t find it?</b> <a href="' + SUPPORT + '" target="_top">Send a support request</a> – you can attach a diagnostics report so support can see exactly what’s going on.</div>';
     } else if (!t) {
       $('art').innerHTML = '<h1>How can we help?</h1><p class="lead">Pick what it’s about. If the screen’s dot is orange or red, start with Troubleshooting.</p><div class="cats">' +
         CATS.map(function (x) { return '<a href="#' + x.id + '"><span class="ic">' + x.icon + '</span><b>' + esc(x.name) + '</b><small>' + esc(x.what) + '</small><em>' + x.topics.length + ' topics</em></a>'; }).join('') +
         '<a class="sup" href="' + SUPPORT + '" target="_top"><span class="ic">💬</span><b>Ask for help</b><small>Send a support request, a feature request or feedback – with a diagnostics report if you like</small><em>Opens the form</em></a></div>';
     } else {
       $('art').innerHTML = '<h1><span>' + t.icon + '</span>' + esc(t.title) + '</h1><p class="lead">' + esc(t.summary) + '</p>' + t.body +
         '<div class="still"><b>Still stuck?</b> <a href="' + SUPPORT + '" target="_top">Send a support request</a> – with a diagnostics report, support can see exactly what’s going on.</div>';
     }
     nav($('q') ? $('q').value : ''); window.scrollTo(0, 0);
     document.title = (t ? t.title + ' – ' : c ? c.name + ' – ' : '') + 'Family Dashboard help';
   }
   window.addEventListener('hashchange', show);
   show();
 })();
</script>
</body></html>
