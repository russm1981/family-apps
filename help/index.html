<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Dashboard – Help</title><meta name="theme-color" content="#0c0e12">
<link rel="icon" href="../admin/icons/icon-192.png">
<link rel="stylesheet" href="../shared/base.css">
<style>
 body { min-height: 100vh; }
 .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 18px 60px; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 28px; }
 @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } nav.side { position: static !important; } }
 .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
 .top a.home { color: var(--acc); text-decoration: none; font-size: 14px; margin-left: auto; }
 .top .logo { width: 44px; height: 44px; border-radius: 13px; background: var(--acc); display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; }
 .top h1 { font-size: 24px; margin: 0; }
 nav.side { position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 4px; }
 nav.side input { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; margin-bottom: 8px; }
 nav.side a { display: flex; gap: 10px; align-items: center; color: #cdd5e1; text-decoration: none; padding: 8px 10px; border-radius: 10px; font-size: 15px; }
 nav.side a:hover { background: var(--panel); } nav.side a.on { background: var(--panel-2); color: #fff; font-weight: 700; }
 nav.side a i { font-style: normal; width: 24px; text-align: center; }
 article { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 26px 26px; min-width: 0; }
 article h1 { margin: 0 0 6px; font-size: 26px; display: flex; gap: 12px; align-items: center; }
 article .lead { color: #cdd5e1; font-size: 17px; margin: 0 0 14px; }
 article h2 { font-size: 18px; margin: 22px 0 6px; }
 article p, article li, article dd, article td { color: #cdd5e1; font-size: 15.5px; line-height: 1.55; }
 article dt { font-weight: 700; margin-top: 12px; } article dd { margin: 4px 0 0 0; }
 article a { color: var(--acc); }
 article code { background: #0b0d11; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
 table.t { border-collapse: collapse; width: 100%; } table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; } table.t td:first-child { white-space: nowrap; }
 .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; } .dot.g { background: #34c759; } .dot.o { background: #ffb020; } .dot.r { background: #ff5b5b; }
 .still { margin-top: 26px; padding: 14px 16px; border-radius: 14px; background: rgba(63,169,245,.1); border: 1px solid rgba(63,169,245,.35); color: #cdd5e1; font-size: 15px; }
 .list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
 .list a { display: block; background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-decoration: none; color: inherit; }
 .list a b { display: block; margin-bottom: 4px; } .list a span { color: var(--mute); font-size: 14px; }
</style>
</head>
<body><div class="wrap">
 <div class="top"><span class="logo">?</span><h1>Help</h1><a class="home" href="../">‹ Family Dashboard home</a></div>
 <nav class="side" id="side"></nav>
 <article id="art"></article>
</div>
<script src="topics.js"></script>
<script>
 (function () {
   'use strict';
   var T = window.FD_HELP || [], $ = function (id) { return document.getElementById(id); };
   function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
   function nav(q) {
     q = (q || '').toLowerCase();
     var cur = location.hash.slice(1);
     $('side').innerHTML = '<input id="q" placeholder="Search help…" value="' + esc(q) + '">' + '<a href="#"' + (!cur ? ' class="on"' : '') + '><i>⌂</i>All topics</a>' +
       T.filter(function (t) { return !q || (t.title + ' ' + t.summary + ' ' + t.body).toLowerCase().indexOf(q) >= 0; })
        .map(function (t) { return '<a href="#' + t.id + '"' + (t.id === cur ? ' class="on"' : '') + '><i>' + t.icon + '</i>' + esc(t.title) + '</a>'; }).join('');
     var box = $('q'); box.oninput = function () { var v = box.value, p = box.selectionStart; nav(v); $('q').focus(); $('q').setSelectionRange(p, p); };
   }
   function show() {
     var id = location.hash.slice(1), t = T.filter(function (x) { return x.id === id; })[0];
     if (!t) {
       $('art').innerHTML = '<h1>How can we help?</h1><p class="lead">Pick a topic. If the screen’s dot is orange or red, start with “The coloured dot on the screen”.</p><div class="list">' +
         T.map(function (x) { return '<a href="#' + x.id + '"><b>' + x.icon + ' ' + esc(x.title) + '</b><span>' + esc(x.summary) + '</span></a>'; }).join('') + '</div>';
     } else {
       $('art').innerHTML = '<h1><span>' + t.icon + '</span>' + esc(t.title) + '</h1><p class="lead">' + esc(t.summary) + '</p>' + t.body +
         (t.id !== 'report' ? '<div class="still"><b>Still stuck?</b> <a href="#report">Send a diagnostics report to support</a> – it tells them exactly what’s going on.</div>' : '');
     }
     nav($('q') ? $('q').value : ''); window.scrollTo(0, 0);
     document.title = (t ? t.title + ' – ' : '') + 'Family Dashboard help';
   }
   window.addEventListener('hashchange', show);
   show();
 })();
</script>
</body></html>
